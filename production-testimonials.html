  <!-- Testimonials. One client per band, cycling the band colours.

  <section class="band band--orange">
    <figure class="pull-quote pull-quote--long">
      <blockquote>
        <p>I have worked with Jo for many years and she has become an integral and highly valued part of my business. She has a creative flair and eye for detail that means she has become the driving force behind the growth and expansion of our digital portfolio.</p>
        <p>She leads on the content creation and editing of The Lonely Leader Podcast, our Leadership Accelerator Email Newsletter and The Lonely Leader Academy (our virtual leadership development platform). In addition, she supports numerous elements of the design and delivery of our social media engagement across a range of platforms.</p>
        <p>Jo has energy and positivity that shines through every time you interact with her. She is a pleasure to work with. I trust her implicitly and value her judgement in all aspects of our business strategy.</p>
        <p>I look forward to working with her for many years to come and would have no hesitation in recommending her to any organisation. She can be a real asset to you, as she is for myself and colleagues here at The Lonely Leader.</p>
      </blockquote>
      <figcaption>
        <span class="who">James Rule</span>
        <span class="role">Founder, The Lonely Leader</span>
      </figcaption>
    </figure>
  </section>
